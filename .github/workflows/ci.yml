name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libwayland-dev \
            libxkbcommon-dev libdbus-1-dev \
            desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate crates/cosmic-applet-translator/target/xdgen/app.desktop
          appstreamcli validate --no-net crates/cosmic-applet-translator/target/xdgen/app.metainfo.xml

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh packaging/migrate-panel-entry.sh

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
