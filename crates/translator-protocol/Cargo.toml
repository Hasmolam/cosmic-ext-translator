[package]
name = "translator-protocol"
description = "Messages, regions and the HUD socket shared by the cosmic-ext-translator processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Unix socket client and server for HUD messages.
ipc = ["dep:tokio", "dep:tracing"]
# Log setup shared by the applet and overlay binaries.
logging = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
