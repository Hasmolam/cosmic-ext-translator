[workspace]
resolver = "2"
members = [
    "crates/translator-protocol",
    "crates/translator-core",
    "crates/cosmic-applet-translator",
    "crates/cosmic-translator-overlay",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hasmolam/cosmic-ext-translator"

[workspace.dependencies]
translator-protocol = { path = "crates/translator-protocol" }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
image = "0.25"
ashpd = { version = "0.13", features = ["screencast", "global_shortcuts"] }
pipewire = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
strsim = "0.11"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3
